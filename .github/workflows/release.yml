name: Publish release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (contains(github.event.workflow_run.head_commit.message, '[publish-release]') ||
       contains(github.event.workflow_run.head_commit.message, '[publish-rc]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact commit tested by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Confirm this is still the current main commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$MAIN_SHA" == "$RELEASE_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release for a commit superseded on main."
          fi
      - name: Verify package and application versions match
        if: steps.freshness.outputs.publish == 'true'
        run: |
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          APP_VERSION="$(python - <<'PY'
          import runpy
          values = runpy.run_path("src/terchess/__init__.py")
          print(values["__version__"])
          PY
          )"
          test "$PROJECT_VERSION" = "$APP_VERSION"
      - name: Build and validate Python distributions
        if: steps.freshness.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Build the cross-platform source ZIP
        if: steps.freshness.outputs.publish == 'true'
        run: |
          RAW_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          VERSION="${RAW_VERSION/rc/-rc}"
          RELEASE_TAG="v${VERSION}"
          ZIP_NAME="Terchess-${VERSION}.zip"
          mkdir -p "zip-root/Terchess-${VERSION}"
          git archive HEAD | tar -x -C "zip-root/Terchess-${VERSION}"
          (cd zip-root && zip -qr "../${ZIP_NAME}" "Terchess-${VERSION}")
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          if [[ "${VERSION}" == *-rc* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
      - name: Publish the GitHub release
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            RELEASE_NOTES="Terchess $RELEASE_TAG is a release candidate. Download the cross-platform ZIP, extract it, and use the included one-click launcher for Windows, macOS, or Linux. Stockfish must be installed separately. Stockfish must be installed separately."
            PRERELEASE_ARGS=(--prerelease)
          else
            RELEASE_NOTES="Terchess $RELEASE_TAG is the first stable release. For most users, download the cross-platform Terchess ZIP, extract it, and double-click run_terchess.bat (Windows), run_terchess.command (macOS), or run_terchess.sh (Linux). On first launch the script installs Python dependencies. Stockfish must be installed separately. Stockfish must be installed separately."
            PRERELEASE_ARGS=()
          fi
          gh release create "$RELEASE_TAG" dist/* "$ZIP_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Terchess $RELEASE_TAG" \
            --target "$RELEASE_SHA" \
            --notes "$RELEASE_NOTES" \
            "${PRERELEASE_ARGS[@]}"
