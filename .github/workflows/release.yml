name: Publish release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (contains(github.event.workflow_run.head_commit.message, '[publish-release]') ||
       contains(github.event.workflow_run.head_commit.message, '[publish-rc]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact commit tested by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and validate Python distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Build the cross-platform source ZIP
        run: |
          RAW_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          VERSION="${RAW_VERSION/rc/-rc}"
          RELEASE_TAG="v${VERSION}"
          ZIP_NAME="Terchess-${VERSION}.zip"
          mkdir -p "zip-root/Terchess-${VERSION}"
          git archive HEAD | tar -x -C "zip-root/Terchess-${VERSION}"
          (cd zip-root && zip -qr "../${ZIP_NAME}" "Terchess-${VERSION}")
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          if [[ "${VERSION}" == *-rc* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            RELEASE_NOTES="Terchess $RELEASE_TAG is a release candidate. Download the cross-platform ZIP, extract it, and follow the Windows, macOS, or Linux instructions in README.md. Stockfish must be installed separately."
            PRERELEASE_ARGS=(--prerelease)
          else
            RELEASE_NOTES="Terchess $RELEASE_TAG is the first stable release. For most users, download the cross-platform Terchess ZIP, extract it, and follow the step-by-step Windows, macOS, or Linux instructions in README.md. Stockfish must be installed separately."
            PRERELEASE_ARGS=()
          fi
          gh release create "$RELEASE_TAG" dist/* "$ZIP_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Terchess $RELEASE_TAG" \
            --target "$RELEASE_SHA" \
            --notes "$RELEASE_NOTES" \
            "${PRERELEASE_ARGS[@]}"
