[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terchess"
version = "1.0.0rc2"
description = "Terminal chess against a local Stockfish engine, with board and blindfold modes"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "MaybeSobi" }]
keywords = ["chess", "terminal", "stockfish", "cli", "blindfold-chess"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Terminals",
]
dependencies = [
  "python-chess>=1.999",
  "rich>=13.7",
  "prompt-toolkit>=3.0.43",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/MaybeSobi/Terchess"
Repository = "https://github.com/MaybeSobi/Terchess"
Issues = "https://github.com/MaybeSobi/Terchess/issues"
Changelog = "https://github.com/MaybeSobi/Terchess/blob/main/CHANGELOG.md"

[project.scripts]
terchess = "terchess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
